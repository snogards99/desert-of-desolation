name: validate
on: [push, pull_request]
jobs:
  audio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
