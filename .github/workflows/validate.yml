name: validate
on:
  push:
  pull_request:

jobs:
  project-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify project consistency
        run: npm run verify
