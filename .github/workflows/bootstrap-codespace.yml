name: bootstrap-codespace
on:
  push:
    paths:
      - ".github/workflows/bootstrap-codespace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt GitHub-native Codespace creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api --method POST /repos/snogards99/desert-of-desolation/codespaces \
            -f ref="main" \
            > /tmp/codespace.json
          cat /tmp/codespace.json
