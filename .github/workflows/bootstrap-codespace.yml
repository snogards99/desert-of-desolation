name: bootstrap-codespace
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    env:
      CODESPACE_PAT: ${{ secrets.CODESPACE_PAT }}
    steps:
      - name: Check user-scoped Codespaces token
        run: |
          if [ -z "$CODESPACE_PAT" ]; then
            echo "CODESPACE_PAT is not configured."
            echo "Create the Codespace once from GitHub UI, or add a user token with Codespaces: write and rerun this workflow."
            exit 0
          fi
      - name: Create GitHub Codespace
        if: env.CODESPACE_PAT != ''
        env:
          GH_TOKEN: ${{ env.CODESPACE_PAT }}
        run: |
          set -eu
          gh api --method POST /repos/snogards99/desert-of-desolation/codespaces -f ref="main"
